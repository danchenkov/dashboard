<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- Use the device's width so the page also works on a narrow screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analytics Dashboard — First Steps</title>
    <link rel="stylesheet" href="./styles.css">
    <!-- Modules support import/export and run after HTML parsing finishes. -->
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">JavaScript learning project · Days 1–3</p>
        <h1>Analytics dashboard</h1>
        <p>Explore a small, fictional sales dataset loaded from a local JSON file.</p>
      </header>
      <section class="widget" aria-labelledby="sales-heading">
        <h2 id="sales-heading">Sales records</h2>
        <!-- role=status announces loading/results to assistive technology. -->
        <p id="status" role="status">Loading sales records…</p>
        <!-- JavaScript inserts one table here once the data has loaded. -->
        <div id="table-container" class="table-container"></div>
      </section>
      <noscript><p>Enable JavaScript to load and display the sales records.</p></noscript>
    </main>
  </body>
</html>
